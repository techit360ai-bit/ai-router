name: TECHIT — Test and Deploy

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:

  # ─────────────────────────────────────────
  # Run on every push and every PR
  # ─────────────────────────────────────────
  test:
    name: Smoke Test — AI Brain
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run AI Brain smoke test
        env:
          DATABASE_URL:       ${{ secrets.DATABASE_URL }}
          REDIS_URL:          ${{ secrets.REDIS_URL }}
          OPENAI_API_KEY:     ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          SECRET_KEY:         test-secret-key-ci-only
          ENVIRONMENT:        test
        run: |
          python3 -c "
          from ai_router_core import ScoringEngine, ModelRouter, TaskType
          from model_registry import ModelRegistry
          from training_module import ModuleLibrary
          from database_schema import Base

          gsis = ScoringEngine.compute_gsis(70,65,60,55,40,72,50,35,80)
          assert 0 < gsis['gsis'] < 100, 'GSIS out of range'
          registry = ModelRegistry()
          router = ModelRouter(registry)
          assert len(registry.task_policies) == len(TaskType), 'Task policy coverage mismatch'
          assert len(registry.models) >= 20, 'Model registry coverage mismatch'
          assert not {'credit_ledger', 'credit_purchases', 'paywall_hits'} & set(Base.metadata.tables), 'Commercial tables returned'
          assert not hasattr(__import__('ai_router_core'), 'SubscriptionTier'), 'Commercial tier returned'
          assert len(ModuleLibrary.all_modules()) == 35, 'Module count mismatch'
          assert len(Base.metadata.tables) >= 30, 'Table count mismatch'
          print('✅ All smoke tests passed')
          "

  # ─────────────────────────────────────────
  # Deploy to staging — runs on push to staging
  # ─────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'

    steps:
      - name: Trigger Render staging deploy
        run: |
          curl -s -X POST "${{ secrets.RENDER_STAGING_DEPLOY_HOOK }}" \
            -o /dev/null -w "HTTP %{http_code}\n"
          echo "✅ Staging deploy triggered"

  # ─────────────────────────────────────────
  # Deploy to production — runs on push to main
  # ─────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Verify merged PR provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          count="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" --jq '[.[] | select(.merged_at != null)] | length')"
          test "$count" -gt 0

      - name: Trigger Render production deploy
        run: |
          curl -s -X POST "${{ secrets.RENDER_PRODUCTION_DEPLOY_HOOK }}" \
            -o /dev/null -w "HTTP %{http_code}\n"
          echo "✅ Production deploy triggered"
