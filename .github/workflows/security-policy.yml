name: ai-router-security-policy

on:
  pull_request:
  push:
    branches: [main, master, feat/agentrouter-provider]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: test -f docs/SECURITY_CHANGE_PROTOCOL.md
      - run: python -m pip install -r requirements.txt
      - run: pytest -q
