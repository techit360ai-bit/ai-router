name: Dependency Assurance

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  dependabot-policy:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: dependabot/fetch-metadata@21025c705c08248db411dc16f3619e6b5f9ea21a # v2
        id: metadata
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Block major and high-risk automatic updates
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          DEPENDENCY_NAMES: ${{ steps.metadata.outputs.dependency-names }}
        run: |
          if [[ "$UPDATE_TYPE" == version-update:semver-major ]]; then
            echo "Major dependency updates require an engineer-led migration PR."
            exit 1
          fi
          if [[ "$DEPENDENCY_NAMES" =~ (pydantic|fastapi|sqlalchemy|redis|celery|openai|anthropic|python-jose) ]]; then
            echo "High-risk AI/runtime/security dependencies require manual review."
            exit 1
          fi

  dependency-review:
    if: github.event_name == 'pull_request' && github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/dependency-review-action@56339e523c0409420f6c2c9a2f4292bbb3c07dd3 # v4.8.0
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0-only,AGPL-3.0-only

  python-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Audit locked Python dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt --format=json > /tmp/pip-audit.json || true
          python .github/scripts/pip-audit-regression.py
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          artifact-name: ai-router-sbom.spdx.json

  filesystem-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # master
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
